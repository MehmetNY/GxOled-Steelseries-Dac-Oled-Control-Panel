name: Validate historical October 18 volume OSD binary
on:
  push:
    branches:
      - diagnostics/volume-osd-timing
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-original-2026-10-18:
    runs-on: windows-latest
    env:
      # GitHub runner repo path exceeds MSVC's file-tracking path limit.
      # Build in a short local location without touching original source bytes.
      CARGO_TARGET_DIR: C:\\b
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
      - name: Extract original user-verified October 18 source
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath 'diagnostics/legacy-2026-10-18/ggoled-volume-osd-bugfix.zip' -DestinationPath 'legacy-osd-src'
          if (-not (Test-Path legacy-osd-src/ggoled_draw/src/lib.rs)) { throw 'Old original source missing' }
      - name: Build original, standalone ggoled release
        working-directory: legacy-osd-src
        shell: pwsh
        run: |
          cargo check --locked -p ggoled_app --features sdl3-static
          if ($LASTEXITCODE -ne 0) { throw 'Historical Cargo check failed' }
          cargo build --locked --release -p ggoled_app --features sdl3-static
          if ($LASTEXITCODE -ne 0) { throw 'Historical EXE build failed' }
      - name: Create labelled comparative test EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item C:\\b\\release\\ggoled_app.exe artifact/ggoled-2026-10-18-known-good-comparison.exe
          (Get-FileHash artifact/ggoled-2026-10-18-known-good-comparison.exe -Algorithm SHA256).Hash | Set-Content artifact/SHA256.txt
      - name: Upload original behavior comparison (NOT A RELEASE)
        uses: actions/upload-artifact@v4
        with:
          name: GxOled-October-18-Original-OSD-Comparison-Windows
          path: artifact/*
          if-no-files-found: error
