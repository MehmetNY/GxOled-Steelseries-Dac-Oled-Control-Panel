name: Publish GxOled Advanced v0.5.1
on:
  push:
    branches:
      - release/v0.5.1-advanced
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gxoled-advanced-v051-release
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
      - name: Verify original UI and v0.5.1 label
        shell: pwsh
        run: |
          $ui = Get-Content gxoled_app/src/settings_window.rs -Raw
          foreach ($marker in @('GENERAL CONTROL','CLOCK GALLERY','LIVE OLED','MONOCHROME','GxOled Advanced v0.5.1')) {
            if (-not $ui.Contains($marker)) { throw "Protected UI marker missing: $marker" }
          }
          if ($ui.Contains('OLED CONTROL CENTER')) { throw 'Unwanted redesigned UI detected' }
          if (-not (Test-Path go_animations/gxoled-animations.exe)) { throw 'Embedded Go renderer missing' }
      - name: Cargo check
        run: cargo check --locked -p gxoled_app --features sdl3-static
      - name: Regression tests
        run: cargo test --locked -p gxoled_app -p gxoled_lib -p gxoled_draw --features gxoled_app/sdl3-static
      - name: Build Windows Release EXE
        run: cargo build --locked --release -p gxoled_app --features sdl3-static
      - name: Package renamed executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/release/gxoled.exe 'release/GxOled Advanced v0.5.1.exe'
          $sha = (Get-FileHash 'release/GxOled Advanced v0.5.1.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  GxOled Advanced v0.5.1.exe" | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GxOled-Advanced-v0.5.1-Windows-x64
          path: |
            release/GxOled Advanced v0.5.1.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub v0.5.1 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.5.1 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'v0.5.1 already exists; refusing overwrite' }
          gh release create v0.5.1 'release/GxOled Advanced v0.5.1.exe' release/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title 'GxOled Advanced v0.5.1' --notes 'Windows x64 release. Suppresses duplicate same-level DAC volume-dial HID events to restore the intended ~2.5s native volume OSD handoff. Includes v0.5.0 media cleanup fixes. Preserves the original UI and all previous stable releases.' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish GitHub release' }
