name: GxOled Advanced - Development prerelease

on:
  push:
    branches: ["development/advanced-**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Verify and publish development EXE
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go_animations/go.mod
      - name: Build embedded renderer
        shell: pwsh
        run: |
          Push-Location go_animations
          go build -trimpath -o gxoled-animations.exe ./cmd/renderer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check desktop app
        shell: pwsh
        run: |
          cargo check --locked -p gxoled_app --features sdl3-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run tests
        shell: pwsh
        run: |
          cargo test --locked -p gxoled_app -p gxoled_draw -p gxoled_lib --features gxoled_app/sdl3-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build release binary
        shell: pwsh
        run: |
          cargo build --locked --release -p gxoled_app --features sdl3-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage executable and ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target/release/gxoled.exe release/gxoled.exe
          Copy-Item go_animations/gxoled-animations.exe release/gxoled-animations.exe
          Compress-Archive -Path release/gxoled.exe,release/gxoled-animations.exe -DestinationPath release/GxOled-Advanced-Development-Windows-x64.zip
          $names = @('gxoled.exe','gxoled-animations.exe','GxOled-Advanced-Development-Windows-x64.zip')
          $lines = foreach ($name in $names) {
            $h = (Get-FileHash (Join-Path release $name) -Algorithm SHA256).Hash.ToLower()
            "$h  $name"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding utf8
      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: GxOled-Advanced-dev-${{ github.run_number }}
          path: |
            release/gxoled.exe
            release/GxOled-Advanced-Development-Windows-x64.zip
            release/SHA256SUMS.txt
      - name: Publish prerelease for this push
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $tag = "v0.5.0-dev.${{ github.run_number }}"
          gh release create $tag release/gxoled.exe release/GxOled-Advanced-Development-Windows-x64.zip release/SHA256SUMS.txt --repo $env:GH_REPO --target $env:GITHUB_SHA --title "GxOled Advanced Development #${{ github.run_number }}" --notes "Development preview generated only after successful Windows cargo check, Rust unit tests and release build. Source commit: $env:GITHUB_SHA. Not the stable v0.5.0 rollback build." --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
