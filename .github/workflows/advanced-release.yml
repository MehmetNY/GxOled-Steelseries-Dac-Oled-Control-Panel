name: GxOled Advanced - Stable v0.5.0

on:
  push:
    branches: ["release/v0.5.0-advanced"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Compile, test and publish Windows v0.5.0
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact stable source
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go_animations/go.mod
      - name: Build embedded animation renderer
        shell: pwsh
        run: |
          Push-Location go_animations
          go build -trimpath -o gxoled-animations.exe ./cmd/renderer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check app
        shell: pwsh
        run: |
          cargo check --locked -p gxoled_app --features sdl3-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run unit tests
        shell: pwsh
        run: |
          cargo test --locked -p gxoled_app -p gxoled_draw -p gxoled_lib --features gxoled_app/sdl3-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile release executable
        shell: pwsh
        run: |
          cargo build --locked --release -p gxoled_app --features sdl3-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build distributable and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target/release/gxoled.exe release/gxoled.exe
          Copy-Item go_animations/gxoled-animations.exe release/gxoled-animations.exe
          Compress-Archive -Path release/gxoled.exe,release/gxoled-animations.exe -DestinationPath release/GxOled-Advanced-v0.5.0-Windows-x64.zip
          $names = @('gxoled.exe','gxoled-animations.exe','GxOled-Advanced-v0.5.0-Windows-x64.zip')
          $lines = foreach ($name in $names) {
            $h = (Get-FileHash (Join-Path release $name) -Algorithm SHA256).Hash.ToLower()
            "$h  $name"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding utf8
      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GxOled-Advanced-v0.5.0-Windows-x64
          path: |
            release/gxoled.exe
            release/GxOled-Advanced-v0.5.0-Windows-x64.zip
            release/SHA256SUMS.txt
      - name: Publish fixed stable release once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh release view v0.5.0 --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Stable release v0.5.0 already exists; not replacing it.'
            exit 0
          }
          gh release create v0.5.0 release/gxoled.exe release/GxOled-Advanced-v0.5.0-Windows-x64.zip release/SHA256SUMS.txt --repo $env:GH_REPO --target $env:GITHUB_SHA --title "GxOled Advanced" --notes "Stable rollback baseline from supplied 2026-10-25 Classic/Dark UI sources. Only the Windows E0382 compiler fix and release packaging were changed. No Studio editor is included in this stable release." --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
