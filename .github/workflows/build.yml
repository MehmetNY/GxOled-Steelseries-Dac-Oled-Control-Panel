name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache
        uses: actions/cache@v6
        with:
          key: unit-tests-${{ hashFiles('Cargo.lock') }}
          path: |
            ~/.cargo
            target
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Test HID parsing and drawing logic
        run: cargo test --locked -p gxoled_lib -p gxoled_draw

  windows-msvc-build:
    name: Windows MSVC build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache
        uses: actions/cache@v6
        with:
          key: x86_64-pc-windows-msvc-${{ hashFiles('Cargo.lock') }}
          path: |
            ~/.cargo
            target
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build embedded Windows animation renderer
        shell: pwsh
        run: Push-Location go_animations; go build -o gxoled-animations.exe ./cmd/renderer; Pop-Location
      - name: Check desktop app
        run: cargo check --locked -p gxoled_app
      - name: Test HID parsing, drawing logic, and media metadata handling
        run: cargo test --locked -p gxoled_app -p gxoled_lib -p gxoled_draw --features gxoled_app/sdl3-static
      - name: Build desktop app with SDL3 static
        run: cargo build --locked --release -p gxoled_app --features sdl3-static
      - name: Upload Windows development EXE (artifact only, not a release)
        uses: actions/upload-artifact@v7
        with:
          name: GxOled-Studio-Windows-dev
          path: target/release/gxoled.exe

  windows-build:
    name: Windows GNU cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache
        uses: actions/cache@v6
        with:
          key: x86_64-pc-windows-gnu-${{ hashFiles('Cargo.lock') }}
          path: |
            ~/.cargo
            target
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64 g++-mingw-w64
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-gnu
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Cross-build embedded Go animation renderer
        run: cd go_animations && GOOS=windows GOARCH=amd64 go build -o gxoled-animations.exe ./cmd/renderer
      - name: Build
        run: cargo build --locked --release --features sdl3-static --target x86_64-pc-windows-gnu
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: x86_64-pc-windows-gnu
          path: |
            target/x86_64-pc-windows-gnu/release/gxoled-cli.exe
            target/x86_64-pc-windows-gnu/release/gxoled.exe

  flatpak-build:
    name: Flatpak build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache
        uses: actions/cache@v6
        with:
          key: flatpak-${{ hashFiles('Cargo.lock', 'flatpak/io.github.gxoled.GxOled.yml') }}
          path: |
            ~/.cargo
            ~/.local/share/flatpak
            flatpak/.flatpak-builder
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install flatpak
        run: sudo apt-get update && sudo apt-get install -y flatpak dbus-x11
      - name: Build
        run: dbus-run-session bash flatpak/build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: GxOled-x86_64.flatpak
          path: flatpak/GxOled-x86_64.flatpak

  editor-and-go-tests:
    name: Studio JavaScript and Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Check embedded Studio script
        run: node studio/verify-editor.cjs
      - name: Test Go animation backend
        run: cd go_animations && go test ./...
